<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plane Architecture Hub | AUIGrid & CrossEditor Enterprise UI</title>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Plane Web + AUIGrid + CrossEditor Stylesheet -->
  <link rel="stylesheet" href="/css/plane.css">
  <!-- Marked.js & Highlight.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/lib/highlight.min.js"></script>
  <!-- Vue 2.7 Production Build -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
</head>
<body>
<div id="app">
  <!-- 1. Left Icon Rail (Plane Dark Rail) -->
  <aside class="plane-rail">
    <!-- Workspace Logo -->
    <div class="plane-rail-logo" @click="selectRailItem('c')" title="Plane System Hub">
      <span>P</span>
    </div>
    
    <div class="plane-rail-group">
      <!-- 6. Star Icon (즐겨찾기, 1번 c의 바로 위) -->
      <div class="plane-rail-item" 
           :class="{ active: currentRailView === 'favorites' }" 
           @click="selectRailItem('favorites')" 
           title="즐겨찾기">
        <svg class="plane-rail-star" style="width:20px;height:20px;" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
        </svg>
        <span class="plane-tooltip">즐겨찾기</span>
      </div>

      <!-- 1. 소문자 c (c-TTTM) -->
      <div class="plane-rail-item" 
           :class="{ active: currentRailView === 'c' }" 
           @click="selectRailItem('c')" 
           title="c-TTTM">
        <span class="plane-rail-letter">c</span>
        <span class="plane-tooltip">c-TTTM</span>
      </div>

      <!-- 2. 소문자 i (i-TTTM) -->
      <div class="plane-rail-item" 
           :class="{ active: currentRailView === 'i' }" 
           @click="selectRailItem('i')" 
           title="i-TTTM">
        <span class="plane-rail-letter">i</span>
        <span class="plane-tooltip">i-TTTM</span>
      </div>

      <!-- 3. 소문자 f (fdc-TTTM) -->
      <div class="plane-rail-item" 
           :class="{ active: currentRailView === 'f' }" 
           @click="selectRailItem('f')" 
           title="fdc-TTTM">
        <span class="plane-rail-letter">f</span>
        <span class="plane-tooltip">fdc-TTTM</span>
      </div>

      <!-- 4. 소문자 o (output-TTTM) -->
      <div class="plane-rail-item" 
           :class="{ active: currentRailView === 'o' }" 
           @click="selectRailItem('o')" 
           title="output-TTTM">
        <span class="plane-rail-letter">o</span>
        <span class="plane-tooltip">output-TTTM</span>
      </div>

      <!-- 5. 대문자 C (C-TTTM) - 개별 컴포넌트 -->
      <div class="plane-rail-item" 
           :class="{ active: currentRailView === 'C' }" 
           @click="selectRailItem('C')" 
           title="C-TTTM">
        <span class="plane-rail-letter">C</span>
        <span class="plane-tooltip">C-TTTM</span>
      </div>

      <!-- 5. 대문자 I (I-TTTM) - 개별 컴포넌트 -->
      <div class="plane-rail-item" 
           :class="{ active: currentRailView === 'I' }" 
           @click="selectRailItem('I')" 
           title="I-TTTM">
        <span class="plane-rail-letter">I</span>
        <span class="plane-tooltip">I-TTTM</span>
      </div>

      <!-- 5. 대문자 F (F-TTTM) - 개별 컴포넌트 -->
      <div class="plane-rail-item" 
           :class="{ active: currentRailView === 'F' }" 
           @click="selectRailItem('F')" 
           title="F-TTTM">
        <span class="plane-rail-letter">F</span>
        <span class="plane-tooltip">F-TTTM</span>
      </div>

      <!-- 5. 대문자 O (O-TTTM) - 개별 컴포넌트 -->
      <div class="plane-rail-item" 
           :class="{ active: currentRailView === 'O' }" 
           @click="selectRailItem('O')" 
           title="O-TTTM">
        <span class="plane-rail-letter">O</span>
        <span class="plane-tooltip">O-TTTM</span>
      </div>
    </div>

    <!-- Rail Bottom -->
    <div class="plane-rail-bottom">
      <div class="plane-rail-item" @click="showNavModal = true" title="Customize Settings">
        <svg style="width:20px;height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span class="plane-tooltip">시스템 설정</span>
      </div>
      <div class="plane-avatar" title="Plane Workspace Admin">A</div>
    </div>
  </aside>

  <!-- 2. Dynamic Independent Component for each rail view (c, i, f, o, C, I, F, O) -->
  <component :is="activeComponentName" :key="currentRailView"></component>

  <!-- 3. Customize Navigation Modal -->
  <div class="plane-modal-overlay" v-if="showNavModal" @click.self="showNavModal = false">
    <div class="plane-modal-content">
      <div class="plane-modal-header">
        <h3 class="plane-modal-title">Customize System Navigation</h3>
        <button class="plane-modal-close" @click="showNavModal = false">&times;</button>
      </div>
      <div class="plane-modal-body">
        <p style="font-size:13px; color:#64748b; margin-bottom:16px;">
          사내 시스템 UI 참고용 샘플 아키텍처 설정 모달입니다.
        </p>

        <div class="plane-modal-section-title">글로벌 레일 모듈 (8종 + 즐겨찾기)</div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px;">
          <div class="plane-modal-item"><input type="checkbox" checked> <label>c-TTTM (소문자 c)</label></div>
          <div class="plane-modal-item"><input type="checkbox" checked> <label>C-TTTM (대문자 C)</label></div>
          <div class="plane-modal-item"><input type="checkbox" checked> <label>i-TTTM (소문자 i)</label></div>
          <div class="plane-modal-item"><input type="checkbox" checked> <label>I-TTTM (대문자 I)</label></div>
          <div class="plane-modal-item"><input type="checkbox" checked> <label>fdc-TTTM (소문자 f)</label></div>
          <div class="plane-modal-item"><input type="checkbox" checked> <label>F-TTTM (대문자 F)</label></div>
          <div class="plane-modal-item"><input type="checkbox" checked> <label>output-TTTM (소문자 o)</label></div>
          <div class="plane-modal-item"><input type="checkbox" checked> <label>O-TTTM (대문자 O)</label></div>
        </div>

        <div class="plane-modal-section-title" style="margin-top:16px;">Enterprise UI 플러그인 연동</div>
        <div class="plane-modal-item"><input type="checkbox" checked> <label>AUIGrid v4.2.0 고성능 데이터 시트 (엑셀 다운로드/필터/정렬)</label></div>
        <div class="plane-modal-item"><input type="checkbox" checked> <label>Namo CrossEditor v3.5 리치 위지위그 에디터 (표삽입/디자인/HTML)</label></div>
      </div>
      <div class="plane-modal-footer">
        <button class="plane-btn" @click="showNavModal = false">닫기</button>
        <button class="plane-btn plane-btn-primary" @click="showNavModal = false">설정 저장</button>
      </div>
    </div>
  </div>
</div>

<!-- Vue 2 Application Script -->
<script src="/js/app.js"></script>
</body>
</html>
